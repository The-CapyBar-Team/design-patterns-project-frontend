events {}
http {
    include /etc/nginx/mime.types;
    
    # Add additional MIME types that might be missing
    types {
        application/wasm wasm;
        application/octet-stream clr;
        application/octet-stream dll;
        application/json json;
        application/javascript js;
        text/css css;
        application/font-woff woff;
        application/font-woff2 woff2;
    }
    
    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;
        
        # Increase the body size limit (default is 1MB)
        client_max_body_size 20M;
        
        # Allow CDN access (needed for Bootstrap and Bootstrap Icons)
        location ~* ^/(https://cdn.jsdelivr.net/) {
            proxy_pass $1;
            proxy_set_header Host cdn.jsdelivr.net;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Configure caching for static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
        
        # Configure for Blazor WebAssembly
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
        
        # Handle 404 errors
        error_page 404 /index.html;
        
        # Configure for Blazor's WebAssembly files
        location /_framework/ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
        
        # Explicitly handle CSS files with proper MIME type
        location ~* \.css$ {
            add_header Content-Type text/css;
        }
        
        # Make sure all style sheets are accessible
        location = /ClientBlazor.styles.css {
            add_header Content-Type text/css;
        }
        
        location = /css/app.css {
            add_header Content-Type text/css;
        }
    }

    # Enable gzip compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/wasm
        text/css
        text/plain
        text/xml;
}